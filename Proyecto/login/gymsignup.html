    const direccionInput = document.getElementById('direccion');
    const serviciosInput = document.getElementById('servicios');
    const equipamientoInput = document.getElementById('equipamiento');
    const sugerenciasDireccionDiv = document.getElementById('sugerencias-direccion');
    const sugerenciasServiciosDiv = document.getElementById('sugerencias-servicios');
    const sugerenciasEquipamientoDiv = document.getElementById('sugerencias-equipamiento');

    // Función para mostrar sugerencias en un div específico
    function mostrarSugerencias(input, sugerencias, sugerenciasDiv) {
        const valorInput = input.value.toLowerCase();
        sugerenciasDiv.innerHTML = '';

        const sugerenciasFiltradas = sugerencias.filter(sugerencia =>
            sugerencia.toLowerCase().includes(valorInput)
        );

        sugerenciasFiltradas.forEach(sugerencia => {
            const sugerenciaElement = document.createElement('div');
            sugerenciaElement.textContent = sugerencia;
            sugerenciaElement.classList.add('sugerencia');
            sugerenciaElement.addEventListener('click', () => {
                input.value = sugerencia;
                sugerenciasDiv.innerHTML = ''; // Borra las sugerencias después de seleccionar una
            });
            sugerenciasDiv.appendChild(sugerenciaElement);
        });
    }

    // Event listeners para los campos de entrada
    direccionInput.addEventListener('input', () => {
        mostrarSugerencias(direccionInput, sugerenciasDirecciones, sugerenciasDireccionDiv);
    });

    serviciosInput.addEventListener('input', () => {
        mostrarSugerencias(serviciosInput, sugerenciasServicios, sugerenciasServiciosDiv);
    });

    equipamientoInput.addEventListener('input', () => {
        mostrarSugerencias(equipamientoInput, sugerenciasEquipamiento, sugerenciasEquipamientoDiv);
    });
